services:
  # FastAPI receives HTTP requests.
  api:
    build: .
    image: scrapeflow-api
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-books.toscrape.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    # Check whether FastAPI is responding to requests.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Celery processes scraping jobs in the background.
  worker:
    build: .
    image: scrapeflow-api
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=info
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    # Verify that the Celery worker responds through Redis.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A app.celery_app:celery_app
          inspect ping --timeout=5 -d "celery@$$HOSTNAME"
          | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis transports tasks between FastAPI and Celery.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL stores scraping jobs and results.
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5
  # Apply database migrations before starting the API and worker.
  migrate:
    build: .
    image: scrapeflow-api

    # Apply all outstanding Alembic migrations.
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head

    # Reuse the application's PostgreSQL connection.
    environment: *app_environment

    # PostgreSQL must be healthy before migration starts.
    depends_on:
      db:
        condition: service_healthy

    # Only run when Docker Compose starts the service.
    restart: "no"

# Named volumes preserve data after containers stop.
volumes:
  postgres_data:
